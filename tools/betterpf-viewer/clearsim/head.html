<title>Clear Sim Viewport</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Committed single dark viewport: this is an instrument, not a document, and it is painted
   explicitly so it holds on either host ground. */
:root{
  --ground:#14161c; --surface:#1c1f28; --surface-2:#232733; --line:#2c313d;
  --ink:#e6e9f0; --ink-dim:#8b93a5; --ink-faint:#5d6475;
  --floor:#4a5468; --wall:#2a2f3b;
  --body:#7dd3fc; --star:#f0a541; --implosion:#c084fc; --dead:#3a3f4b;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:14px; line-height:1.5;
  display:grid; grid-template-rows:auto 1fr auto; overflow:hidden;
}
header{
  display:flex; align-items:baseline; gap:16px; flex-wrap:wrap;
  padding:14px 18px; border-bottom:1px solid var(--line); background:var(--surface);
}
h1{
  margin:0; font-family:var(--mono); font-size:15px; font-weight:600;
  letter-spacing:.14em; text-transform:uppercase; text-wrap:balance;
}
.sub{color:var(--ink-dim); font-size:12.5px}
.picker{margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
select{
  font-family:var(--mono); font-size:12.5px; color:var(--ink);
  background:var(--surface-2); border:1px solid var(--line); border-radius:4px;
  padding:6px 9px; cursor:pointer;
}
select:focus-visible{outline:2px solid var(--body); outline-offset:1px}
#stage{position:relative; min-height:0; background:var(--ground)}
canvas{display:block; width:100%; height:100%; cursor:grab}
canvas:active{cursor:grabbing}
#hud{
  position:absolute; top:14px; left:16px; pointer-events:none;
  font-family:var(--mono); font-size:12px; line-height:1.75;
  color:var(--ink-dim); font-variant-numeric:tabular-nums;
  text-shadow:0 1px 3px rgba(0,0,0,.85);
}
#hud b{color:var(--ink); font-weight:500}
#hud .k{display:inline-block; min-width:104px; color:var(--ink-faint)}
.sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
#legend{
  position:absolute; bottom:14px; left:16px; pointer-events:none;
  font-family:var(--mono); font-size:11.5px; color:var(--ink-dim);
  display:flex; gap:16px; flex-wrap:wrap;
  text-shadow:0 1px 3px rgba(0,0,0,.85);
}
footer{
  display:flex; align-items:center; gap:14px; padding:11px 18px;
  border-top:1px solid var(--line); background:var(--surface);
}
button{
  font-family:var(--mono); font-size:12.5px; font-weight:500; color:var(--ink);
  background:var(--surface-2); border:1px solid var(--line); border-radius:4px;
  padding:7px 13px; cursor:pointer; min-width:74px;
}
button:hover{border-color:var(--body); color:var(--body)}
button:focus-visible{outline:2px solid var(--body); outline-offset:1px}
input[type=range]{flex:1; accent-color:var(--body); min-width:120px}
.tick{
  font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12.5px;
  color:var(--ink-dim); min-width:132px;
}
.tick b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
