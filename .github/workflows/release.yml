name: Release

# One rolling release: every push to main replaces the "main" release.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.6.1
      - name: Odin 0.3.7 (26.3 port, not released yet)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37808382947 -R odtheking/OdinFabric -n Odin-0.3.7.jar -D libs/odin
      - name: Version
        run: echo "EC_VERSION=$(date -u +%Y.%-m.%-d)+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - run: gradle build --console=plain -Dorg.gradle.jvmargs=-Xmx2G
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete release-main --yes --cleanup-tag || true
          gh release create release-main build/libs/*.jar --target "$GITHUB_SHA" --title main --notes "$EC_VERSION" --latest
