name: Release

# Here: a build and test check on each push. In ADM (promote.sh copies this file): one rolling release per
# Minecraft version, main the newest (Latest), each older one on an mc/<version> branch.
on:
  push:
    branches: [main, "mc/**"]
    paths-ignore: ["**.md", "docs/**"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.8.0
      - name: Odin 0.4.0
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download 0.4.0 -R odtheking/Odin -p Odin-0.4.0.jar -D /tmp/odin && mkdir -p libs && unzip -q /tmp/odin/Odin-0.4.0.jar -d libs/odin
      - name: Version
        run: |
          echo "EC_VERSION=$(date -u +%Y.%-m.%-d)+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          MC=$(grep -oP 'com\.mojang:minecraft:\K[^"]+' build.gradle.kts)
          echo "MC=$MC" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            .gradle
            build/kotlin
            build/classes
            build/tmp
          key: ec-compile-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: ec-compile-${{ github.ref_name }}-
      - run: gradle build -x test --console=plain -Dorg.gradle.jvmargs=-Xmx6G -Pkotlin.daemon.jvmargs=-Xmx6G
      - name: Publish
        if: github.repository == 'undonecoffee/adm'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "release-$MC" --yes --cleanup-tag || true
          if [ "$GITHUB_REF_NAME" = main ]; then latest=--latest; else latest=--latest=false; fi
          # releases/download/release-<channel>/EngineerClient-<mc>.jar
          jar="EngineerClient-$MC.jar"
          cp build/libs/*.jar "$jar"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/release-$MC/$jar"
          notes="$(printf '**[Download EngineerClient for Minecraft %s](%s)** · %s\n\nPut the jar in your `mods` folder. Needs Fabric, Fabric API, Fabric Language Kotlin and Odin.' "$MC" "$url" "$EC_VERSION")"
          extra=; [ -f update.json ] && extra=update.json
          gh release create "release-$MC" "$jar" $extra --target "$GITHUB_SHA" \
            --title "EngineerClient for Minecraft $MC" \
            --notes "$notes" $latest

  test:
    if: github.repository != 'undonecoffee/adm'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.8.0
          cache-read-only: true
      - name: Odin 0.4.0
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download 0.4.0 -R odtheking/Odin -p Odin-0.4.0.jar -D /tmp/odin && mkdir -p libs && unzip -q /tmp/odin/Odin-0.4.0.jar -d libs/odin
      - run: gradle test --console=plain -Dorg.gradle.jvmargs=-Xmx6G -Pkotlin.daemon.jvmargs=-Xmx6G
