name: release

# Every push to main publishes a GitHub release with the jar. See RELEASE.md.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag is already released. Bump mod_version in gradle.properties and cut CHANGELOG.md (see RELEASE.md)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > changes.md
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section. Cut the changelog (see RELEASE.md)."
            exit 1
          fi

          # Commits since the previous release; before the first release, since the commit
          # the fork started from.
          prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo efa46bb)
          {
            cat changes.md
            echo
            echo "### Commits"
            git log --no-merges --format='- %s (%h)' "$prev..HEAD"
          } > release-notes.md
          cat release-notes.md

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Odin 0.3.7 (26.3 port, not released yet)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37808382947 -R odtheking/OdinFabric -n Odin-0.3.7.jar -D libs/odin
      - run: ./gradlew build --no-daemon --console=plain

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # The same jar under Engineer Client's name too, for links to the latest release's EngineerClient-<mc>.jar.
          MC=$(grep -oP 'com\.mojang:minecraft:\K[^"]+' build.gradle.kts)
          cp "build/libs/ads-$VERSION.jar" "EngineerClient-$MC.jar"
          gh release create "$TAG" "build/libs/ads-$VERSION.jar" "EngineerClient-$MC.jar" \
            --target "$GITHUB_SHA" \
            --title "ADS $VERSION" \
            --notes-file release-notes.md \
            --latest

      # Engineer Client's players download releases/download/release-<mc>/EngineerClient-<mc>.jar (one rolling
      # release per Minecraft version). That release now carries ADS's jar, so the link keeps working and updating.
      - name: Update Engineer Client's download link
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          MC=$(grep -oP 'com\.mojang:minecraft:\K[^"]+' build.gradle.kts)
          jar="EngineerClient-$MC.jar"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/release-$MC/$jar"
          gh release delete "release-$MC" --yes --cleanup-tag || true
          gh release create "release-$MC" "$jar" --target "$GITHUB_SHA" --latest=false \
            --title "EngineerClient for Minecraft $MC" \
            --notes "$(printf '**[Download for Minecraft %s](%s)**: ADS %s (Engineer Client is now ADS; see [%s](https://github.com/%s/releases/tag/%s) for what changed).\n\nPut the jar in your `mods` folder. Needs Fabric, Fabric API and Fabric Language Kotlin; Odin is optional.' "$MC" "$url" "$VERSION" "$TAG" "$GITHUB_REPOSITORY" "$TAG")"
