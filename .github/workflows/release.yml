name: release

# Every push to main publishes a GitHub release with the jar. See RELEASE.md.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag is already released. Bump mod_version in gradle.properties and cut CHANGELOG.md (see RELEASE.md)."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Write release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > changes.md
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section. Cut the changelog (see RELEASE.md)."
            exit 1
          fi

          # Commits since the previous release; before the first release, since the commit
          # the fork started from.
          prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo efa46bb)
          {
            cat changes.md
            echo
            echo "### Commits"
            git log --no-merges --format='- %s (%h)' "$prev..HEAD"
          } > release-notes.md
          cat release-notes.md

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Odin 0.3.7 (26.3 port, not released yet)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37808382947 -R odtheking/OdinFabric -n Odin-0.3.7.jar -D libs/odin
      - run: ./gradlew build --no-daemon --console=plain

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" "build/libs/ads-$VERSION.jar" \
            --target "$GITHUB_SHA" \
            --title "ADS $VERSION" \
            --notes-file release-notes.md
