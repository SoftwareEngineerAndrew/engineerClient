name: Release

# One rolling release per Minecraft version: main is the newest (26.3, release "main"); each older
# version lives on an mc/<version> branch with its own release ("26.2", "26.1.2"). Every push
# replaces that branch's release.
on:
  push:
    branches: [main, "mc/**"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.6.1
      - name: Odin 0.3.7 (26.3 port, not released yet)
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37808382947 -R odtheking/OdinFabric -n Odin-0.3.7.jar -D libs/odin
      - name: Version
        run: |
          echo "EC_VERSION=$(date -u +%Y.%-m.%-d)+${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          echo "CHANNEL=${GITHUB_REF_NAME#mc/}" >> "$GITHUB_ENV"
          echo "MC=$(grep -oP 'com\.mojang:minecraft:\K[^"]+' build.gradle.kts)" >> "$GITHUB_ENV"
      - run: gradle build --console=plain -Dorg.gradle.jvmargs=-Xmx2G
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "release-$CHANNEL" --yes --cleanup-tag || true
          if [ "$CHANNEL" = main ]; then latest=--latest; else latest=--latest=false; fi
          # One jar with a fixed name per Minecraft version, so its download link never changes:
          # releases/download/release-<channel>/EngineerClient-<mc>.jar
          jar="EngineerClient-$MC.jar"
          cp build/libs/*.jar "$jar"
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/release-$CHANNEL/$jar"
          notes="$(printf '**[Download EngineerClient for Minecraft %s](%s)** · %s\n\nPut the jar in your `mods` folder. Needs Fabric, Fabric API, Fabric Language Kotlin and Odin.' "$MC" "$url" "$EC_VERSION")"
          gh release create "release-$CHANNEL" "$jar" --target "$GITHUB_SHA" \
            --title "EngineerClient for Minecraft $MC" \
            --notes "$notes" $latest
