name: Test build

# A jar to try out from a work branch (wip/**), built exactly like the release (release.yml) but never published:
# it is attached to the run as an artifact (Actions > this run > Artifacts). No release or tag is touched.
on:
  push:
    branches: ["wip/**"]

permissions:
  contents: read
  actions: read

concurrency:
  group: test-build-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.6.1
      - name: Odin 0.4.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download 0.4.0 -R odtheking/Odin -p Odin-0.4.0.jar -D /tmp/odin && mkdir -p libs && unzip -q /tmp/odin/Odin-0.4.0.jar -d libs/odin
      - name: Version
        run: |
          echo "EC_VERSION=$(date -u +%Y.%-m.%-d)+${GITHUB_SHA::7}-test" >> "$GITHUB_ENV"
          MC=$(grep -oP 'com\.mojang:minecraft:\K[^"]+' build.gradle.kts)
          echo "MC=$MC" >> "$GITHUB_ENV"
      - run: gradle build -x test --console=plain -Dorg.gradle.jvmargs=-Xmx6G -Pkotlin.daemon.jvmargs=-Xmx6G
      - name: Name the jar
        run: |
          mkdir -p out
          cp build/libs/*.jar "out/EngineerClient-$MC-test-${GITHUB_SHA::7}.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: EngineerClient-${{ env.MC }}-test-${{ github.sha }}
          path: out/*.jar
          retention-days: 30
