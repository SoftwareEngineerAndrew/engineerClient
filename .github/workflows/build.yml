name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 26

      - uses: gradle/actions/setup-gradle@v5

      # gradle.properties pins org.gradle.java.home to a local path; use the runner's JDK instead.
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build -x test --console=plain "-Dorg.gradle.java.home=$JAVA_HOME"

      - uses: actions/upload-artifact@v6
        with:
          name: engineerclient
          path: build/libs/*.jar
