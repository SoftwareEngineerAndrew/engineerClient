name: build

on:
  push:
    # main is built and released by release.yml.
    branches-ignore: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Odin 0.3.7 (26.3 port, not released yet)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37808382947 -R odtheking/OdinFabric -n Odin-0.3.7.jar -D libs/odin
      - run: ./gradlew build --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: ads
          path: build/libs/*.jar
